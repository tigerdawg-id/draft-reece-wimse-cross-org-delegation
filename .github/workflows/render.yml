name: render
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install xml2rfc
      - run: xml2rfc --text --html draft-reece-wimse-cross-org-delegation-02.xml
      - uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: |
            *.txt
            *.html